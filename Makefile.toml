[env]
DATABASE_URL = "sqlite:./resources/migrations/users.sqlite?mode=rwc"
LEPTOS_WASM_OPT_VERSION = "version_125"
#LEPTOS_WASM_BINDGEN_VERSION = "0.2.106"
LEPTOS_SASS_VERSION = "1.97.3"
RUSTDOCFLAGS = "--cfg docsrs --html-in-header resources/katex-header.html --html-in-header resources/flams-docs.html --enable-index-page -Zunstable-options --generate-link-to-definition"

[tasks.db-create]
workspace = false
install_crate = "sqlx-cli"
command = "cargo"
args = ["sqlx", "database", "create"]

[tasks.db-migrate]
workspace = false
install_crate = "sqlx-cli"
command = "cargo"
args = ["sqlx", "migrate", "run", "--source", "resources/migrations"]

[tasks.db-setup]
workspace = false
install_crate = "sqlx-cli"
command = "cargo"
args = [
    "sqlx",
    "prepare",
    "--workspace",
    "--",
    "--features=backend",
    "--package=flams-database",
]

[tasks.db]
workspace = false
dependencies = ["db-create", "db-migrate", "db-setup"]

[tasks.update]
workspace = false
clear = true
script = '''
git pull
cargo clean
cargo install cargo-leptos
cargo install wasm-bindgen-cli
rustup update
cargo update
'''


[tasks.leptos-release]
workspace = false
install_crate = "cargo-leptos"
command = "cargo"
# --split (leptos's per-route lazy-loaded WASM code-splitting) is dropped
# here: with cargo-leptos 0.3.7 + leptos 0.8.17 + wasm_split_helpers 0.2.0,
# it deterministically produces a broken split-point symbol pairing
# (undefined `__wasm_split_00_..._import_..._View` symbols at link time,
# reproducible even after a full clean rebuild - not a caching issue).
# Single monolithic WASM bundle instead; revisit once the toolchain
# versions are compatible again.
args = ["leptos", "build", "--release","--split"]

[tasks.doc]
workspace = false
install_crate = false
command = "cargo"
args = [
    "+nightly",
    "doc",
    "--workspace",
    "--no-deps",
    "--all-features",
    "--release",
    "--document-private-items",
]


[tasks.docs]
alias = "doc"

[tasks.copy-to-bin]
workspace = false
script_runner = "@rust"
script = '''
use std::path::Path;
fn copy_dir_all(src: &Path, dst: &Path) -> std::io::Result<()> {
    std::fs::create_dir_all(dst)?;
    for entry in std::fs::read_dir(src)? {
        let entry = entry?;
        let ty = entry.file_type()?;
        if ty.is_dir() {
            copy_dir_all(&entry.path(), &dst.join(entry.file_name()))?;
        } else {
            std::fs::copy(&entry.path(), &dst.join(entry.file_name()))?;
        }
    }
    Ok(())
}
fn main() {
  let _ = std::fs::remove_dir_all(Path::new("./bin"));
  std::fs::create_dir_all(Path::new("./bin")).unwrap();
  copy_dir_all(&Path::new("./target/web"),&Path::new("./bin/web")).unwrap();
  std::fs::copy(Path::new("./resources/settings.toml"),Path::new("./bin/settings.toml")).unwrap();
  #[cfg(target_os="windows")]
  {
    let main_file = Path::new("./target/x86_64-pc-windows-msvc/flams-release/flams.exe");
    if main_file.exists() {
      std::fs::copy(main_file,Path::new("./bin/flams.exe")).unwrap();
      std::fs::copy(Path::new("./target/x86_64-pc-windows-msvc/flams-release/hash.txt"),Path::new("./bin/hash.txt")).unwrap();
    } else {
      std::fs::copy(Path::new("./target/flams-release/flams.exe"),Path::new("./bin/flams.exe")).unwrap();
      std::fs::copy(Path::new("./target/flams-release/hash.txt"),Path::new("./bin/hash.txt")).unwrap();
    }
  }
  #[cfg(not(target_os="windows"))]
  {
    std::fs::copy(Path::new("./target/flams-release/flams"),Path::new("./bin/flams")).unwrap();
    std::fs::copy(Path::new("./target/flams-release/hash.txt"),Path::new("./bin/hash.txt")).unwrap();
  }
}
'''

