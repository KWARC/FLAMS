[package]
name = "flams-stex"
version = "0.0.1"
edition = "2024"

[dev-dependencies]
tracing-subscriber = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# real_archive_build.rs drives the real Queue/Scheduler, which needs the
# tokio-backed AsyncEngine (TokioEngine) - the plain [dependencies] entry
# below intentionally leaves "tokio" off so non-test builds of this crate
# don't pull it in.
flams-system = { workspace = true, features = ["tokio"] }

[dependencies]
ftml-ontology = { workspace = true, features = ["serde"] }
ftml-uris = { workspace = true }

flams-ftml = { workspace = true }
flams-system = { workspace = true }
flams-utils = { workspace = true, features = ["serde"] }
ftml-solver = {workspace = true}

flams-math-archives = { workspace = true }

rustex_lib = { workspace = true }
tex_engine = { workspace = true }

chrono = { workspace = true }
tracing = { workspace = true, features = ["log"] }
parking_lot = { workspace = true }
paste = { workspace = true }
either = { workspace = true }
regex = { workspace = true }
smallvec = { workspace = true }
eyre = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
